[workspace]
resolver = "3"
members = ["crates/cvt-core", "crates/cvt-tui", "crates/cvt"]

[workspace.package]
version = "0.3.0"
edition = "2024"
# Not a guess: ratatui 0.30 declares 1.88, and it is the highest floor in the
# dependency graph. The CI `msrv` job builds the workspace against exactly this
# version, so lowering it without checking that job is a lie rather than an
# optimisation.
rust-version = "1.88"
license = "GPL-3.0-or-later"
repository = "https://github.com/retort-hubbub/clash-verge-tui"
homepage = "https://github.com/retort-hubbub/clash-verge-tui"
authors = ["retort-hubbub <334264732+retort-hubbub@users.noreply.github.com>"]
description = "A fast, keyboard-driven terminal UI for the mihomo (Clash.Meta) core"

[workspace.dependencies]
# --- error handling ---
anyhow = "1.0.104"
thiserror = "2.0.21"
# --- async runtime ---
tokio = { version = "1.53.1", features = [
    "rt-multi-thread", "macros", "sync", "time", "signal", "process", "fs", "io-util", "net",
] }
futures-util = "0.3.34"
async-trait = "0.1.89"
# --- TUI ---
ratatui = "0.30.2"
crossterm = { version = "0.29.0", features = ["event-stream"] }
# --- serialization ---
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_norway = "0.9.42"
# --- http / ws ---
reqwest = { version = "0.13.5", default-features = false, features = [
    "json", "stream", "rustls", "http2", "gzip", "brotli", "charset",
] }
tokio-tungstenite = "0.30.0"
# --- misc ---
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.7", features = ["derive", "env", "wrap_help"] }
dirs = "7.0.0"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
unicode-width = "0.2.2"
bytes = "1.12.1"
humantime = "2.4.0"
percent-encoding = "2.3.2"
regex = "1.13.1"
shlex = "1.3.0"
libc = "0.2.180"

[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
# Pragmatic relaxations: these fight idiomatic ratatui/serde code.
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
doc_markdown = "allow"
cast_precision_loss = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
too_many_lines = "allow"
struct_excessive_bools = "allow"
option_if_let_else = "allow"
items_after_statements = "allow"
unused_async = "allow"
future_not_send = "allow"
# Style lints that produce noise without catching defects. Each is a deliberate
# choice, not an oversight:
#
# * `missing_const_for_fn` fires on ~30 trivial accessors. Marking them `const`
#   buys nothing here (they are not used in const context) and makes signatures
#   harder to read and to change.
# * `derive_partial_eq_without_eq` wants `Eq` on every value type. Several of
#   ours hold `serde_json::Value`, which is not `Eq`, and none is used as a map
#   key, so the derive would buy nothing.
# * `needless_raw_string_hashes` fires on every `r#"..."#` in the tests.
#   Uniform raw-string syntax is worth more than the two characters it saves.
missing_const_for_fn = "allow"
derive_partial_eq_without_eq = "allow"
needless_raw_string_hashes = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
