[package]
name = "cvt-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Core domain logic for clash-verge-tui (no UI dependencies)"

[dependencies]
anyhow.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json = { workspace = true, features = ["preserve_order"] }
serde_norway.workspace = true
dirs.workspace = true
chrono.workspace = true
tracing.workspace = true
regex.workspace = true
# `rustix` rather than `libc` so that signalling a process needs no
# `unsafe`, which the workspace denies outright.
rustix = { version = "1.1.5", default-features = false, features = ["std", "process"] }
tokio.workspace = true
futures-util.workspace = true
reqwest.workspace = true
tokio-tungstenite.workspace = true
bytes.workspace = true

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
