# Dependency policy, enforced by `cargo deny check` in CI.
#
# The allow list below is not aspirational: it is the set of licenses that are
# actually reachable in `Cargo.lock`, enumerated from `cargo metadata`. Adding a
# dependency whose license is not listed here fails the build, which is the
# point — a new license should be a decision somebody makes on purpose.

[graph]
# Check every target, so a dependency that is only pulled in on another
# platform cannot slip past the audit.
all-features = true

[advisories]
# RustSec advisories are checked, but a yanked crate is not by itself a reason
# to fail: it is nearly always a publish accident upstream, and the fix is a
# version bump rather than a broken build.
yanked = "warn"
unmaintained = "workspace"
ignore = []

[licenses]
# How confident cargo-deny must be that it has identified a license from a
# crate's metadata before it acts on it.
confidence-threshold = 0.9
allow = [
    # The overwhelmingly common pair, in every spelling that appears in the
    # tree. `MIT OR Apache-2.0` and `MIT/Apache-2.0` are the same grant.
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    # Permissive licenses that appear once or twice, each checked to be
    # GPL-3.0-compatible before being listed.
    "0BSD",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "MIT-0",
    "Unlicense",
    "Zlib",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "BSL-1.0",
    "WTFPL",
    # The Unicode data licenses, pulled in by the IDNA and regex tables.
    "Unicode-3.0",
    "Unicode-DFS-2016",
    # MPL-2.0 is weak copyleft and is explicitly compatible with the GPL, so it
    # is acceptable for this project even though the project itself is GPL-3.0.
    "MPL-2.0",
    # This project's own license. Our crates are unpublished workspace members
    # and are skipped by default, but naming it keeps the list correct if one
    # is ever published.
    "GPL-3.0-or-later",
]
# Nothing needs an exception yet. If a dependency ever requires one, add it
# here with the crate name and version so the exception is visible and scoped,
# rather than widening the allow list above.
exceptions = []
# A license in the allow list that no crate uses usually means the list has
# drifted. Here it is `allow` on purpose: the audit only resolves the graph for
# the machine it runs on, and license *expressions* resolve per target — a crate
# that is `BSD-2-Clause OR Apache-2.0 OR MIT` needs only one allowed branch, and
# which branch gets reported can depend on what the platform pulls in. Pruning
# an allowance that is merely unused on Linux would move the failure to macOS
# instead of removing it.
unused-allowed-license = "allow"

[bans]
multiple-versions = "warn"
# A `*` version requirement means a dependency can change under us without a
# lockfile change.
wildcards = "deny"
allow-wildcard-paths = true
# Nothing is denied outright yet. `deny` entries belong here when a specific
# crate is known to be unmaintained or to have a better replacement.
deny = []
skip = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# No git dependencies: a dependency pinned to a branch is not a dependency
# anybody can reproduce. Add the repository here if one is ever needed.
allow-git = []
